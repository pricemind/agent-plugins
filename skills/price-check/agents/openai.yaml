interface:
  display_name: "Price check"
  short_description: "One product: every competitor price, stock and history"
  brand_color: "#5B2D92"
  default_prompt: "Use $price-check to show every competitor price and the price history for this product."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "pricemind"
      description: "Pricemind MCP server (sign in with your Pricemind account)"
      transport: "streamable_http"
      url: "https://mcp.pricemind.io/mcp"
