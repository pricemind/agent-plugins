<!doctype html>
<!--
  Pricemind chart renderer · version 1.1.1

  Single source: the Pricemind MCP server, which serves this page as the MCP App
  resource ui://pricemind/chart. The plugin repo pricemind/agent-plugins ships a
  byte-identical copy at skills/price-intelligence/assets/chart.html, refreshed by
  scripts/sync-chart.sh. Edit only the server's file.

  No libraries, no network: every style and script is inline, so the page works
  in an MCP Apps sandbox (CSP default-src 'none') and when opened as a local file.

  TWO MODES
  1. MCP App. A host that supports MCP Apps (io.modelcontextprotocol/ui) shows this
     page next to a search_query result. The page talks to the host over
     postMessage JSON-RPC (ui/initialize, ui/notifications/tool-input,
     ui/notifications/tool-result, host-context-changed, size-changed, open-link,
     download-file, request-display-mode, tools/call for drill-down).
  2. Template. An assistant whose client cannot show MCP Apps copies this file,
     replaces the JSON inside <script id="pricemind-chart-data"> and opens or
     publishes the file. A non-null object there switches the page to this mode.

  DATA OBJECT (both modes; in MCP App mode it is built from the tool result)
    {
      "title":    "Price history: own price vs competitors",  optional, defaults to visual.title
      "subtitle": "Bosch GSR 18V-55 · last 90 days",           optional
      "visual":   { ...the visual hint exactly as search_query returns it... },  optional
      "rows":     [ ...search_query data.rows... ],             required
      "columns":  [ {"name": "price", "type": "number"}, ... ], optional (search_query data.columns)
      "open_in_pricemind_url": "https://app.pricemind.io/channels/12/prices",  optional
      // also accepted, all optional:
      "channel_id": 12, "currency": "EUR", "locale": "bg-BG", "shops": {"own": [...], "competitors": [...]}
    }
  The raw search_query structured result ({"data": {...}, "visual": {...}}) is also
  accepted as is.

  HINT HANDLING
  - Every colour, muted/omitted shop, highlight and note is optional. Missing
    colours fall back to the Pricemind palette (own indigo, seven competitor slots,
    then Other grey), so a minimal {"kind": "bar", "x": "title", "y": "gap_pct"}
    hint draws correctly.
  - Kinds: step_line, line, bar, grouped_bar, stacked_bar, price_ladder, timeline,
    heatmap. Unknown kinds or a missing visual show the table.
  - Heatmap override: a grouped_bar-shaped hint (x = first dimension, series =
    second dimension, y = value) with kind set to "heatmap" draws rows = x values,
    columns = series values, cells = y. The native heatmap hint uses x = columns,
    y = rows and value = the cell column. Without visual.scale the cells diverge at
    100 when the value column is an index, at 0 when values cross zero, and shade
    from neutral to indigo otherwise.
  - The "Open in Pricemind" link is hidden when no URL is given and none can be
    built from a single channel_id.
-->

<script>
(function () {
  "use strict";

  var VERSION = "1.1.0";
  var APP_PROTOCOL = "2026-01-26";
  var APP_URL = "https://app.pricemind.io";

  // The Pricemind chart palette (the same one the server's chart hint uses); used whenever a hint
  // leaves a colour out.
  var PALETTE = {
    own: { light: "#4f46e5", dark: "#6366f1" },
    other: { light: "#9ca3af", dark: "#6b7280" },
    price_raised: { light: "#047857", dark: "#34d399" },
    price_lowered: { light: "#b91c1c", dark: "#f87171" },
    caution: { light: "#b45309", dark: "#fbbf24" },
    reference: { light: "#646c7a", dark: "#9ca3af" },
    grid: { light: "#eef0f3", dark: "#1f2937" }
  };
  var COMPETITORS = [
    { light: "#ea580c", dark: "#ea580c" }, { light: "#0284c7", dark: "#0e9ad6" }, { light: "#f59e0b", dark: "#d97706" },
    { light: "#c026d3", dark: "#d946ef" }, { light: "#06b6d4", dark: "#0891b2" }, { light: "#a16207", dark: "#a16207" },
    { light: "#db2777", dark: "#ec4899" }
  ];
  var SHOP_COLUMNS = ["shop", "competitor", "lowest_competitor", "retailer"];
  var SVGNS = "http://www.w3.org/2000/svg";

  var root = document.getElementById("app");
  var state = {
    mode: "page",          // "app" (MCP App), "template" (embedded data) or "page" (nothing to show)
    model: null,
    stack: [],
    args: null,
    host: { context: {}, capabilities: {}, info: null },
    view: "chart",
    hidden: {},
    expanded: false,
    showAllRows: false,
    busy: false,
    status: "",
    forcedTheme: null
  };

  // ---------------------------------------------------------------- helpers

  function h(tag, attrs, children) {
    var node = document.createElement(tag);
    setAttrs(node, attrs);
    append(node, children);
    return node;
  }
  function s(tag, attrs, parent) {
    var node = document.createElementNS(SVGNS, tag);
    setAttrs(node, attrs);
    if (parent) parent.appendChild(node);
    return node;
  }
  function setAttrs(node, attrs) {
    if (!attrs) return;
    Object.keys(attrs).forEach(function (key) {
      var value = attrs[key];
      if (value === undefined || value === null || value === false) return;
      if (key === "text") node.textContent = value;
      else if (key === "class") node.setAttribute("class", value);
      else if (key === "style" && typeof value === "object") Object.keys(value).forEach(function (k) { node.style.setProperty(k, value[k]); });
      else if (key.indexOf("on") === 0 && typeof value === "function") node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : String(value));
    });
  }
  function append(node, children) {
    if (children === undefined || children === null || children === false) return;
    if (!Array.isArray(children)) children = [children];
    children.forEach(function (child) {
      if (child === undefined || child === null || child === false) return;
      node.appendChild(typeof child === "string" || typeof child === "number" ? document.createTextNode(String(child)) : child);
    });
  }
  function icon(path) {
    var svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.6");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    svg.setAttribute("aria-hidden", "true");
    svg.innerHTML = path;
    return svg;
  }
  var ICONS = {
    external: '<path d="M9 3h4v4M13 3 7.5 8.5M12 9.5V13H3V4h3.5"/>',
    download: '<path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13h10"/>',
    expand: '<path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9 7M2.5 13.5 7 9"/>',
    collapse: '<path d="M13.5 6.5h-4v-4M2.5 9.5h4v4M9.5 6.5 14 2M6.5 9.5 2 14"/>',
    back: '<path d="M10 3 5 8l5 5"/>'
  };

  function num(value) {
    if (typeof value === "number") return isFinite(value) ? value : null;
    if (typeof value === "string" && value.trim() !== "" && !isNaN(+value)) return +value;
    return null;
  }
  function str(value) { return value === undefined || value === null ? "" : String(value); }
  function uniq(list) { var seen = {}; return list.filter(function (v) { var k = str(v); if (seen[k]) return false; seen[k] = true; return true; }); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function shopName(value) { return str(value).replace(/^https?:\/\//, "").replace(/^www\./, ""); }

  var measureCtx = null;
  function textWidth(text, size, weight) {
    if (!measureCtx) measureCtx = document.createElement("canvas").getContext("2d");
    var family = getComputedStyle(document.body).fontFamily || "sans-serif";
    measureCtx.font = (weight || 400) + " " + (size || 11) + "px " + family;
    return measureCtx.measureText(str(text)).width;
  }
  function truncate(text, size, max, weight) {
    text = str(text);
    if (textWidth(text, size, weight) <= max) return text;
    while (text.length > 1 && textWidth(text + "…", size, weight) > max) text = text.slice(0, -1);
    return text + "…";
  }

  // ---------------------------------------------------------------- theme and formats

  function theme() {
    if (state.forcedTheme) return state.forcedTheme;
    var fromHost = state.host.context && state.host.context.theme;
    if (fromHost === "dark" || fromHost === "light") return fromHost;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function pick(color) {
    if (!color) return null;
    if (typeof color === "string") return color;
    return theme() === "dark" ? (color.dark || color.light) : (color.light || color.dark);
  }
  function colors() {
    var v = state.model && state.model.visual;
    var c = (v && v.colors) || {};
    var out = {};
    Object.keys(PALETTE).forEach(function (key) { out[key] = pick(c[key] || PALETTE[key]); });
    return out;
  }
  function locale() {
    return (state.model && state.model.locale) || (state.host.context && state.host.context.locale) || navigator.language || "en";
  }

  function columnKind(name) {
    var model = state.model;

      s("rect", { x: lx + i * 46, y: ly, width: 44, height: 14, rx: 3, fill: fill(st) }, svg);
      s("text", { class: "pm-tick", x: lx + i * 46 + 22, y: ly + 28, "text-anchor": "middle", text: formatValue(st, valCol, true) }, svg);
    });
    var notes = [];
    if (midpoint === 0 && /(diff|gap|vs_own)/.test(valCol)) notes.push("Amber cells: the competitor is cheaper than you; indigo: you are cheaper.");
    if (midpoint === 100) notes.push("100 is price parity; above it you are more expensive.");
    if (model.rows.length < rowsKeys.length * colKeys.length) notes.push("Dashed cells have no data.");
    return notes;
  }

  // ---------------------------------------------------------------- start

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (state.model) render(); }, 120);
  });
  if (window.matchMedia) {
    var media = window.matchMedia("(prefers-color-scheme: dark)");
    var onScheme = function () { if (!(state.host.context && state.host.context.theme)) render(); };
    if (media.addEventListener) media.addEventListener("change", onScheme); else if (media.addListener) media.addListener(onScheme);
  }

  // A page opened as a file can pin the theme with #theme=dark or #theme=light.
  var pinned = /theme=(dark|light)/.exec(location.hash || "");
  if (pinned && window.parent === window) state.forcedTheme = pinned[1];

  var embedded = null;
  try { embedded = JSON.parse(document.getElementById("pricemind-chart-data").textContent || "null"); } catch (error) { embedded = { error: String(error) }; }
  applyTheme();
  if (embedded && typeof embedded === "object" && !embedded.error) {
    state.mode = "template";
    document.documentElement.classList.add("is-page");
    load(normalise(embedded, embedded.arguments || {}));
  } else if (embedded && embedded.error) {
    document.documentElement.classList.add("is-page");
    showMessage("The chart data is not valid JSON: " + embedded.error);
  } else if (window.parent && window.parent !== window) {
    state.mode = "app";
    connect();
  } else {
    document.documentElement.classList.add("is-page");
    render();
  }

  // Exposed for tests and for fixture pages.
  window.PricemindChart = { version: VERSION, render: function (data) { state.mode = state.mode === "app" ? "app" : "template"; load(normalise(data, (data && data.arguments) || {})); }, csv: function () { return state.model ? csv(state.model) : ""; } };
})();
</script>
</body>
</html>
