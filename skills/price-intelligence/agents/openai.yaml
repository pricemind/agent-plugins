interface:
  display_name: "Price intelligence"
  short_description: "Answer price and competitor questions with charts"
  brand_color: "#5B2D92"
  default_prompt: "Use $price-intelligence to show where my prices sit against competitors."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "pricemind"
      description: "Pricemind MCP server (sign in with your Pricemind account)"
      transport: "streamable_http"
      url: "https://mcp.pricemind.io/mcp"
