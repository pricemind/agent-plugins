interface:
  display_name: "Pricing strategies"
  short_description: "Inspect, draft and change repricing strategies"
  brand_color: "#5B2D92"
  default_prompt: "Use $pricing-strategies to explain my repricing strategies and suggest changes."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "pricemind"
      description: "Pricemind MCP server (sign in with your Pricemind account)"
      transport: "streamable_http"
      url: "https://mcp.pricemind.io/mcp"
