interface:
  display_name: "Pricemind setup"
  short_description: "Check sign-in, pick a channel and get started"
  brand_color: "#5B2D92"
  default_prompt: "Use $setup to check my Pricemind connection and suggest first questions for my data."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "pricemind"
      description: "Pricemind MCP server (sign in with your Pricemind account)"
      transport: "streamable_http"
      url: "https://mcp.pricemind.io/mcp"
